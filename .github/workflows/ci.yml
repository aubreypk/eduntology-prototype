# Continuous evidence, then deployment.
#
# The `check` job is not decoration. It reasons over the ontology with rdflib
# and pySHACL, then puts the JavaScript that deploys on trial against pySHACL
# and fails the build on any disagreement. So every push carries a fresh answer
# to the question Section 4.6 raises — whether materialising the reasoning at
# design time costs anything in correctness — and the run log is a permanent
# record of it rather than a single result from one afternoon.
#
# It runs against curriculum/example, because the Tshwane material is not in
# this repository and CI has no access to it. The example curriculum exercises
# every rule, including the case rule R1 exists for.

name: check and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: "Also re-seed the remote D1 database from the example curriculum"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Reason, then check the deployed rules against the reasoner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build/requirements.txt

      # node:sqlite arrived in 22.5 and the API and its tests depend on it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the design-time dependencies
        run: python -m pip install -r build/requirements.txt

      - name: Check the authored content
        run: python build/check_content.py --curriculum example

      - name: Check the design selection against R2, R3 and R5
        run: python build/test_design.py --curriculum example

      - name: Build the knowledge base
        run: python build/build_kb.py --curriculum example

      - name: Test the API
        run: node api/test/run-tests.mjs

      - name: Does the deployed JavaScript agree with pySHACL?
        run: python build/verify_parity.py --curriculum example

      - name: Check both palettes against WCAG 2.1 AA
        run: python docs/check_contrast.py

      - name: Build the interface
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      # The two reports are the evidence Chapter 6 cites. Keeping them as
      # artefacts means a claim in the dissertation can be traced to the run
      # that produced it.
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            build/build_report.json
            build/parity_report.json
            build/d1-seed.sql
          retention-days: 90

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@v4

      - name: Are the credentials configured?
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set. Skipping the deployment; the checks above still ran."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.creds.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: Rebuild the knowledge base and the D1 seed
        if: steps.creds.outputs.ready == 'true'
        run: |
          python -m pip install -r build/requirements.txt
          python build/build_kb.py --curriculum example

      - name: Build the interface
        if: steps.creds.outputs.ready == 'true'
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      # Seeding is deliberate rather than automatic. It drops and recreates
      # every table, so an unasked-for seed on each push would wipe whatever
      # the deployed instance had accumulated. Run the workflow by hand with
      # "seed" ticked for the first deployment and after any change to the
      # model or the curriculum.
      # Ask the token what it can do before using it. Cloudflare answers a
      # token that lacks D1 with a bare "Authentication error [code: 10000]",
      # and wrangler then helpfully prints the ACCOUNT role -- "Super
      # Administrator - All Privileges" -- which sends you looking in exactly
      # the wrong place. The account role is not the token's scopes.
      - name: Can this token reach D1?
        id: d1check
        if: steps.creds.outputs.ready == 'true' && inputs.seed
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_NAME=$(grep -m1 '^database_name' wrangler.toml | cut -d'"' -f2)
          DB_ID=$(grep -m1 '^database_id' wrangler.toml | cut -d'"' -f2)
          if [ -z "$DB_NAME" ] || [ "${DB_ID#PASTE}" != "$DB_ID" ]; then
            echo "::error::api/wrangler.toml still holds the placeholder database_id. Run: npx wrangler d1 create <name>"
            exit 1
          fi
          echo "db_name=$DB_NAME" >> "$GITHUB_OUTPUT"

          if ! npx --yes wrangler@4 d1 info "$DB_NAME" > d1check.log 2>&1; then
            cat d1check.log
            {
              echo "### The API token cannot reach D1"
              echo ""
              echo "Seeding needs **Account → D1 → Edit** on the token itself."
              echo "Your account role is irrelevant here — a token carries its own,"
              echo "narrower permissions, and the *Edit Cloudflare Workers* template"
              echo "does **not** include D1."
              echo ""
              echo "Fix it at <https://dash.cloudflare.com/profile/api-tokens>:"
              echo "edit the token, add **Account → D1 → Edit**, save, and update the"
              echo "\`CLOUDFLARE_API_TOKEN\` secret if the value changed."
              echo ""
              echo "Or skip the token entirely and seed from your own machine, where"
              echo "\`npx wrangler login\` authorises with your full account rights:"
              echo ""
              echo '```'
              echo "cd api"
              echo "npx wrangler login"
              echo "npx wrangler d1 execute $DB_NAME --remote --file=../build/d1-seed.sql"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The API token lacks D1 access. See the run summary for how to fix it."
            exit 1
          fi
          echo "D1 reachable."

      - name: Seed the remote database
        if: steps.creds.outputs.ready == 'true' && inputs.seed
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Seeding ${{ steps.d1check.outputs.db_name }}"
          npx --yes wrangler@4 d1 execute "${{ steps.d1check.outputs.db_name }}" \
            --remote --yes --file=../build/d1-seed.sql

      - name: Deploy the Worker
        if: steps.creds.outputs.ready == 'true'
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
